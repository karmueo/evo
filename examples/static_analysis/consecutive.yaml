# 每个静止点与前一个静止点的平均位姿比较。
reference_mode: consecutive
# 报告中位置和距离的单位，TUM 输入仍使用米。
unit: mm
# 自动检测使用的滑动窗口时长，单位秒。
window: 0.5
# 自动检测的平移运动速率上限，单位米每秒。
speed_threshold: 0.008
# 自动检测的旋转运动速率上限，单位度每秒。
angular_speed_threshold: 1.0
# 自动检测所需的静止段最短时长，单位秒。
min_duration: 2.0
# 自动检测允许的相邻样本最大时间间隔，单位秒。
max_gap: 0.5

# 示例轨迹的第一次停靠。
static_0:
  # 是否使用这一手动区间。
  enable: false
  # 区间起点相对轨迹首帧的秒数，包含该时刻。
  start_time: 15.0
  # 区间终点相对轨迹首帧的秒数，包含该时刻。
  end_time: 20.0

# 示例轨迹的第二次停靠。
static_1:
  # 是否使用这一手动区间。
  enable: false
  # 区间起点相对轨迹首帧的秒数，包含该时刻。
  start_time: 50.0
  # 区间终点相对轨迹首帧的秒数，包含该时刻。
  end_time: 60.0
